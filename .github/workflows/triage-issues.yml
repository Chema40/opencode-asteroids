name: Triage new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Analyze issue with OpenCode
        id: analyze
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MODEL: openai/gpt-5.6-luna
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          set -euo pipefail

          prompt=$(cat <<'PROMPT'
          Analiza el issue de GitHub que aparece al final de este mensaje para ayudar a revisarlo.

          Devuelve exclusivamente un objeto JSON válido, sin bloques Markdown, sin comentarios y sin texto adicional.
          Usa exactamente este esquema:
          {
            "type": "bug|enhancement|question|documentation",
            "priority": "high|medium|low",
            "summary": "resumen breve en español",
            "reproduction_steps": ["paso 1"],
            "expected_behavior": "comportamiento esperado o No indicado",
            "actual_behavior": "comportamiento actual o No indicado",
            "acceptance_criteria": ["criterio verificable"],
            "missing_information": ["dato que falta"]
          }

          Reglas:
          - No inventes información que no esté en el título o cuerpo.
          - Usa arrays vacíos cuando no corresponda.
          - Si un dato no está indicado, usa exactamente "No indicado".
          - El campo type debe ser una única categoría y priority una única prioridad.
          - No incluyas el cuerpo original en la respuesta.

          Título:
          ---
          PROMPT
          )

          prompt+="$ISSUE_TITLE"
          prompt+=$'\n---\nCuerpo original:\n---\n'
          prompt+="${ISSUE_BODY:-}"
          prompt+=$'\n---\n'

          mkdir -p "$RUNNER_TEMP/issue-triage"
          opencode run --format json --model "$MODEL" "$prompt" > "$RUNNER_TEMP/issue-triage/events.jsonl"

          jq -sr '[.[] | select(.type == "text") | .part.text] | join("\n")' \
            "$RUNNER_TEMP/issue-triage/events.jsonl" > "$RUNNER_TEMP/issue-triage/response.txt"

          node <<'NODE'
          const fs = require('fs')

          const responsePath = `${process.env.RUNNER_TEMP}/issue-triage/response.txt`
          const outputPath = `${process.env.RUNNER_TEMP}/issue-triage/metadata.json`
          let text = fs.readFileSync(responsePath, 'utf8').trim()
            .replace(/^```(?:json)?\s*/i, '')
            .replace(/\s*```$/i, '')

          let metadata
          try {
            metadata = JSON.parse(text)
          } catch {
            const start = text.indexOf('{')
            const end = text.lastIndexOf('}')
            if (start === -1 || end <= start) throw new Error('OpenCode did not return a JSON object')
            metadata = JSON.parse(text.slice(start, end + 1))
          }

          const types = new Set(['bug', 'enhancement', 'question', 'documentation'])
          const priorities = new Set(['high', 'medium', 'low'])
          if (!types.has(metadata.type)) throw new Error(`Invalid issue type: ${metadata.type}`)
          if (!priorities.has(metadata.priority)) throw new Error(`Invalid issue priority: ${metadata.priority}`)
          for (const field of ['summary', 'expected_behavior', 'actual_behavior']) {
            if (typeof metadata[field] !== 'string') throw new Error(`Invalid field: ${field}`)
          }
          for (const field of ['reproduction_steps', 'acceptance_criteria', 'missing_information']) {
            if (!Array.isArray(metadata[field]) || !metadata[field].every((item) => typeof item === 'string')) {
              throw new Error(`Invalid array field: ${field}`)
            }
          }

          fs.writeFileSync(outputPath, JSON.stringify(metadata))
          NODE

      - name: Apply labels and review information
        uses: actions/github-script@v7
        env:
          METADATA_PATH: ${{ runner.temp }}/issue-triage/metadata.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const metadata = JSON.parse(fs.readFileSync(process.env.METADATA_PATH, 'utf8'))
            const { owner, repo } = context.repo
            const issueNumber = context.issue.number
            const issue = context.payload.issue
            const marker = '<!-- opencode-issue-triage -->'

            const labelDefinitions = {
              bug: { color: 'd73a4a', description: 'Something is not working' },
              enhancement: { color: 'a2eeef', description: 'A request for a new feature' },
              question: { color: 'd876e3', description: 'A question or request for clarification' },
              documentation: { color: '0075ca', description: 'Documentation improvements' },
              'priority: high': { color: 'b60205', description: 'High priority' },
              'priority: medium': { color: 'fbca04', description: 'Medium priority' },
              'priority: low': { color: '0e8a16', description: 'Low priority' },
            }
            const labels = [metadata.type, `priority: ${metadata.priority}`]

            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name })
              } catch (error) {
                if (error.status !== 404) throw error
                const definition = labelDefinitions[name]
                await github.rest.issues.createLabel({ owner, repo, name, ...definition })
              }
            }

            await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels })

            if (issue.body?.includes(marker)) {
              core.info('Issue already contains OpenCode triage information; skipping body update.')
              return
            }

            const list = (items) => items.length ? items.map((item) => `- ${item}`).join('\n') : '- No indicado'
            const reviewSection = [
              marker,
              '',
              '---',
              '',
              '## Información para revisión',
              '',
              '> Esta sección ha sido generada automáticamente por OpenCode.',
              '',
              `**Resumen:** ${metadata.summary}`,
              `**Tipo:** ${metadata.type}`,
              `**Prioridad:** ${metadata.priority}`,
              '',
              '**Pasos para reproducir**',
              list(metadata.reproduction_steps),
              '',
              `**Comportamiento esperado:** ${metadata.expected_behavior}`,
              '',
              `**Comportamiento actual:** ${metadata.actual_behavior}`,
              '',
              '**Criterios de aceptación**',
              list(metadata.acceptance_criteria),
              '',
              '**Información faltante**',
              list(metadata.missing_information),
            ].join('\n')

            const originalBody = issue.body || ''
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              body: originalBody ? `${originalBody}\n\n${reviewSection}` : reviewSection,
            })
